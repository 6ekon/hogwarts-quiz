<style>
/* Layout: one centered column, a "night at Hogwarts" single dark look, parchment text, gold accent, four house colours used only for the Sorting result. */
:root{
  --bg:#111827; --bg2:#1b2437; --card:#222d44; --line:#36425c;
  --fg:#f3ead4; --muted:#b7b2a3; --gold:#d9b04c; --gold2:#f0cf7a;
  --good:#5fc48a; --bad:#e46a5f;
  --gry:#8f1e1e; --sly:#1f6b3a; --rav:#1d3f7a; --huf:#c9a227;
  --display:'Cinzel',Georgia,'Times New Roman',serif;
  --body:'Nunito Sans','Segoe UI',Helvetica,Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;
  background-image:radial-gradient(circle at 20% 0%,#243054 0,transparent 45%),radial-gradient(circle at 90% 100%,#2a1f3d 0,transparent 40%)}
.wrap{max-width:640px;margin:0 auto;padding-block:28px 48px;display:flex;flex-direction:column;gap:20px;min-height:100%}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:clamp(28px,7vw,40px);color:var(--gold2);letter-spacing:.02em}
h2{font-size:clamp(20px,5vw,26px);color:var(--gold2)}
.eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:800}
p{margin:0}
.muted{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.btn{appearance:none;border:1px solid var(--line);background:var(--bg2);color:var(--fg);font:inherit;font-weight:600;padding:12px 16px;border-radius:10px;cursor:pointer;text-align:left;transition:background .15s,border-color .15s;min-width:0}
.btn:hover{border-color:var(--gold)}
.btn:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
.btn.primary{background:var(--gold);color:#1a1405;border-color:var(--gold);text-align:center;font-weight:800}
.btn.primary:hover{background:var(--gold2)}
.btn:disabled{opacity:.55;cursor:default}
.btn.correct{background:#1f4d35;border-color:var(--good)}
.btn.wrong{background:#5a2622;border-color:var(--bad)}
.btn.dim{opacity:.3}
.answers{display:grid;gap:10px;grid-template-columns:1fr}
@media(min-width:520px){.answers.two{grid-template-columns:1fr 1fr}}
.answers .btn{display:flex;gap:10px;align-items:flex-start}
.answers .key{font-family:var(--display);color:var(--gold);font-weight:700;flex:none}
input[type=text]{font:inherit;font-size:18px;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);color:var(--fg);width:100%}
input[type=text]:focus-visible{outline:2px solid var(--gold2);outline-offset:1px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>*{min-width:0}
.spacer{flex:1}
.games{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:520px){.games{grid-template-columns:1fr 1fr}}
.game{display:flex;flex-direction:column;gap:6px;align-items:flex-start;padding:16px}
.game .num{font-family:var(--display);color:var(--gold);font-size:13px;letter-spacing:.1em}
.game h3{font-size:19px;color:var(--fg)}
.game .badge{font-size:13px;color:var(--good);font-weight:800}
.progress{display:flex;gap:4px}
.progress i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.progress i.on{background:var(--gold)}
.qtext{font-size:clamp(19px,4.6vw,23px);font-weight:600;line-height:1.35}
.note{font-size:15px;color:var(--muted)}
.house{border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:8px;color:#fff;border:2px solid rgba(255,255,255,.25)}
.house h2{color:#fff;font-size:clamp(26px,7vw,36px)}
.house.gry{background:var(--gry)} .house.sly{background:var(--sly)} .house.rav{background:var(--rav)} .house.huf{background:var(--huf);color:#1a1405} .house.huf h2{color:#1a1405}
.ladder{display:flex;flex-direction:column-reverse;gap:3px;font-variant-numeric:tabular-nums;font-size:14px}
.ladder div{display:flex;justify-content:space-between;padding:3px 10px;border-radius:6px;color:var(--muted)}
.ladder div.safe{color:var(--fg);font-weight:700}
.ladder div.cur{background:var(--gold);color:#1a1405;font-weight:800}
.ladder div.done{color:var(--good)}
.lifelines{display:flex;gap:8px;flex-wrap:wrap}
.lifelines .btn{font-size:14px;padding:8px 12px}
.lifelines .btn.used{text-decoration:line-through;opacity:.45}
.audience{display:flex;gap:10px;align-items:flex-end;height:90px;padding:0 6px}
.audience div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;font-variant-numeric:tabular-nums}
.audience b{display:block;width:100%;background:var(--gold);border-radius:4px 4px 0 0;min-height:3px}
.big{font-family:var(--display);font-size:clamp(34px,9vw,52px);color:var(--gold2);line-height:1}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.result-grid div{background:var(--bg2);border-radius:10px;padding:12px;min-width:0}
.result-grid .k{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800}
.result-grid .v{font-family:var(--display);font-size:22px;color:var(--gold2);font-weight:700}
.toast{font-size:15px;padding:10px 14px;border-radius:10px;background:var(--bg2);border-left:4px solid var(--gold)}
.toast.good{border-color:var(--good)} .toast.bad{border-color:var(--bad)}
.snitch{width:56px;height:56px}
.crest{display:flex;gap:6px}
.crest i{width:14px;height:14px;border-radius:50%;display:inline-block}
footer{font-size:13px;color:var(--muted);text-align:center}
a{color:var(--gold2)}
@media(prefers-reduced-motion:no-preference){.card{animation:in .25s ease-out}}
@keyframes in{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>

];
const SPELLS = [
  {w:'Expelliarmus', spell:true, why:'A spell that knocks the wand out of your enemy\'s hand.'},
  {w:'Spotify', spell:false, why:'A music app. No magic, only subscriptions.'},
  {w:'Alohomora', spell:true, why:'A spell that opens locked doors.'},
  {w:'Lumia', spell:false, why:'An old line of Nokia phones.'},
  {w:'Lumos', spell:true, why:'A spell that makes light at the end of your wand.'},
  {w:'Zalando', spell:false, why:'An online clothes shop.'},
  {w:'Accio', spell:true, why:'A spell that makes an object fly to you.'},
  {w:'Asana', spell:false, why:'A task-management app (and a yoga pose).'},
  {w:'Stupefy', spell:true, why:'A spell that stuns your opponent.'},
  {w:'Wingardium Leviosa', spell:true, why:'The levitation spell. Hermione: "It\'s Levi-O-sa, not Levio-SA!"'}
];
const GAMES = [
  {id:'sorting', num:'Game 1', name:'The Sorting Hat', desc:'6 questions. Find out which house is yours.'},
  {id:'millionaire', num:'Game 2', name:'Who Wants to Be a Millionaire?', desc:'10 questions, 3 lifelines, one million galleons.'},
  {id:'truefalse', num:'Game 3', name:'True or False', desc:'8 quick facts from the talk.'},
  {id:'spells', num:'Game 4', name:'Spell or Brand?', desc:'Magic word or real company? 10 rounds.'}
];

/* ---------- state ---------- */
let S = {name:'', house:null, million:null, truefalse:null, spells:null};
try{ const saved = JSON.parse(localStorage.getItem('hq-state')||'null'); if(saved) S = Object.assign(S, saved);}catch(e){}
function save(){ try{ localStorage.setItem('hq-state', JSON.stringify(S)); }catch(e){} }
const app = document.getElementById('app');
const el = (h)=>{ const t=document.createElement('template'); t.innerHTML=h.trim(); return t.content.firstChild; };
const esc = (s)=>String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = (n)=>n.toLocaleString('en-US');
const snitch = `<svg class="snitch" viewBox="0 0 64 64" aria-hidden="true"><path d="M8 30c6-10 14-12 18-8M56 30c-6-10-14-12-18-8" fill="none" stroke="#d9b04c" stroke-width="3" stroke-linecap="round"/><path d="M10 36c6 8 12 8 16 4M54 36c-6 8-12 8-16 4" fill="none" stroke="#d9b04c" stroke-width="2" stroke-linecap="round"/><circle cx="32" cy="32" r="11" fill="#d9b04c"/><circle cx="32" cy="32" r="11" fill="none" stroke="#f0cf7a" stroke-width="2"/><path d="M26 32h12M32 26v12" stroke="#8a6a1c" stroke-width="2" stroke-linecap="round"/></svg>`;

function header(sub){
  return `<div class="row"><div>${snitch}</div><div><div class="eyebrow">Harry Potter · English class</div><h1>Hogwarts Quiz Night</h1>${sub?`<p class="muted">${sub}</p>`:''}</div></div>`;
}
function progress(i,n){ return `<div class="progress">${Array.from({length:n},(_,k)=>`<i class="${k<i?'on':''}"></i>`).join('')}</div>`; }
function go(view){ location.hash = view==='home'?'':view; render(); }

/* ---------- views ---------- */
function render(){
  const h = (location.hash||'').replace('#','');
  app.innerHTML='';
  if(!S.name){ return viewName(h); }
  if(h==='sorting') return viewSorting();
  if(h==='millionaire') return viewMillionaire();
  if(h==='truefalse') return viewTrueFalse();
  if(h==='spells') return viewSpells();
  if(h==='results') return viewResults();
  return viewHome();
}

function viewName(next){
  app.append(el(header('Four games about the boy who lived. Phones out, wands ready.')));
  const c = el(`<div class="card"><h2>First, your name</h2><p class="muted">It will appear on your results card at the end.</p>
    <input type="text" id="name" placeholder="Your name" maxlength="30" autocomplete="off">
    <button class="btn primary" id="start">Enter Hogwarts</button></div>`);
  app.append(c);
  const inp = c.querySelector('#name');
  const start = ()=>{ const v=inp.value.trim(); if(!v){ inp.focus(); return; } S.name=v; save(); go(next||'home'); };
  c.querySelector('#start').onclick = start;
  inp.addEventListener('keydown', e=>{ if(e.key==='Enter') start(); });
  app.append(el(`<footer>Made for Polina's English presentation · Moscow International University</footer>`));
}

function viewHome(){
  app.append(el(header(`Welcome, ${esc(S.name)}. Pick a game. You can play them in any order.`)));
  const g = el(`<div class="games"></div>`);
  GAMES.forEach(x=>{
    let badge='';
    if(x.id==='sorting' && S.house) badge=`Your house: ${HOUSES[S.house].name}`;
    if(x.id==='millionaire' && S.million!=null) badge=`Won ${fmt(S.million)} galleons`;
    if(x.id==='truefalse' && S.truefalse!=null) badge=`${S.truefalse} / ${TRUEFALSE.length} correct`;
    if(x.id==='spells' && S.spells!=null) badge=`${S.spells} / ${SPELLS.length} correct`;
    const b = el(`<button class="btn game"><span class="num">${x.num}</span><h3>${x.name}</h3><span class="note">${x.desc}</span>${badge?`<span class="badge">✔ ${badge}</span>`:''}</button>`);
    b.onclick=()=>go(x.id); g.append(b);
  });
  app.append(g);
  const done = [S.house,S.million,S.truefalse,S.spells].filter(v=>v!=null).length;
  const r = el(`<div class="card"><div class="row"><div><b>${done} of 4 games played</b><p class="note">Finish all four, then show your results card to Polina.</p></div><span class="spacer"></span><button class="btn ${done===4?'primary':''}" id="res">Results card</button></div></div>`);
  r.querySelector('#res').onclick=()=>go('results'); app.append(r);
  const f = el(`<footer>Not you? <a href="#" id="chg">Change name</a></footer>`);
  f.querySelector('#chg').onclick=(e)=>{e.preventDefault(); S.name=''; save(); render();}; app.append(f);
}

/* Game 1 */
function viewSorting(){
  let i=0; const score={gry:0,sly:0,rav:0,huf:0};
  const show=()=>{
    app.innerHTML='';
    app.append(el(header()));
    if(i>=SORTING.length){
      const best = Object.keys(score).sort((a,b)=>score[b]-score[a])[0];
      S.house=best; save();
      const H=HOUSES[best];
      app.append(el(`<div class="card"><div class="eyebrow">The Sorting Hat says…</div><div class="house ${best}"><div class="crest">${H.colors.map(c=>`<i style="background:${c}"></i>`).join('')}</div><h2>${H.name.toUpperCase()}!</h2><p>House of ${H.trait}.</p></div><p>${H.text}</p>
        <div class="row"><button class="btn primary" id="back">Back to games</button><button class="btn" id="again">Try again</button></div></div>`));
      app.querySelector('#back').onclick=()=>go('home');
      app.querySelector('#again').onclick=()=>{i=0;for(const k in score)score[k]=0;show();};
      return;
    }
    const q=SORTING[i];
    const c=el(`<div class="card"><div class="eyebrow">The Sorting Hat · question ${i+1} of ${SORTING.length}</div>${progress(i,SORTING.length)}<p class="qtext">${q.q}</p><div class="answers"></div></div>`);
    const box=c.querySelector('.answers');
    q.a.forEach(([t,h],k)=>{ const b=el(`<button class="btn"><span class="key">${'ABCD'[k]}</span><span>${t}</span></button>`); b.onclick=()=>{score[h]++;i++;show();}; box.append(b); });
    app.append(c);
    app.append(el(`<footer><a href="#" id="home">Back to games</a></footer>`));
    app.querySelector('#home').onclick=(e)=>{e.preventDefault();go('home');};
  };
  show();
}

/* Game 2 */
function viewMillionaire(){
  let i=0, life={fifty:true,aud:true,phone:true}, hidden=[], locked=false;
  const won=(idx)=>{ // prize after losing on question idx
    let best=0; SAFE.forEach(s=>{ if(idx>s) best=PRIZES[s]; }); return best; };
  const ladder=(cur)=>`<div class="ladder">${PRIZES.map((p,k)=>`<div class="${k===cur?'cur':k<cur?'done':''} ${SAFE.includes(k)?'safe':''}"><span>${k+1}</span><span>${fmt(p)} G</span></div>`).join('')}</div>`;
  const show=(msg)=>{
    app.innerHTML=''; app.append(el(header()));
    const q=MILLION[i];
    const c=el(`<div class="card"><div class="eyebrow">Who Wants to Be a Millionaire? · for ${fmt(PRIZES[i])} galleons</div>${progress(i,MILLION.length)}
      <p class="qtext">${q.q}</p><div class="answers two"></div>
      <div class="lifelines"><button class="btn ${life.fifty?'':'used'}" id="l50">50 : 50</button><button class="btn ${life.aud?'':'used'}" id="laud">Ask the audience</button><button class="btn ${life.phone?'':'used'}" id="lph">Phone a friend</button></div>
      <div id="extra"></div><details><summary class="note">Prize ladder</summary>${ladder(i)}</details></div>`);
    const box=c.querySelector('.answers');
    q.a.forEach((t,k)=>{ const b=el(`<button class="btn ${hidden.includes(k)?'dim':''}" ${hidden.includes(k)?'disabled':''}><span class="key">${'ABCD'[k]}</span><span>${t}</span></button>`);
      b.onclick=()=>answer(k,box); box.append(b); });
    const extra=c.querySelector('#extra');
    if(msg) extra.append(el(msg));
    c.querySelector('#l50').onclick=()=>{ if(!life.fifty||locked)return; life.fifty=false; const wrong=[0,1,2,3].filter(k=>k!==q.c).sort(()=>Math.random()-.5).slice(0,2); hidden=wrong; show(); };
    c.querySelector('#laud').onclick=()=>{ if(!life.aud||locked)return; life.aud=false;
      const avail=[0,1,2,3].filter(k=>!hidden.includes(k)); let pct={}; let left=100; const cp=55+Math.floor(Math.random()*25); pct[q.c]=cp; left-=cp;
      const others=avail.filter(k=>k!==q.c); others.forEach((k,n)=>{ const v=n===others.length-1?left:Math.floor(Math.random()*left); pct[k]=v; left-=v; });
      show(`<div><p class="note">The audience voted:</p><div class="audience">${[0,1,2,3].map(k=>`<div><span>${pct[k]??0}%</span><b style="height:${(pct[k]??0)*0.7}px"></b><span>${'ABCD'[k]}</span></div>`).join('')}</div></div>`); };
    c.querySelector('#lph').onclick=()=>{ if(!life.phone||locked)return; life.phone=false; const sure=Math.random()<0.8; const pick=sure?q.c:[0,1,2,3].filter(k=>k!==q.c&&!hidden.includes(k))[0];
      show(`<div class="toast">📞 Hermione: "${sure?'I\'m quite sure':'Hmm, I think'} it\'s ${'ABCD'[pick]}, ${q.a[pick]}. ${sure?'I read it in a book.':'But don\'t quote me on that.'}"</div>`); };
    app.append(c);
    app.append(el(`<footer><a href="#" id="home">Back to games</a></footer>`));
    app.querySelector('#home').onclick=(e)=>{e.preventDefault();go('home');};
  };
  const answer=(k,box)=>{
    if(locked)return; locked=true; const q=MILLION[i]; const btns=box.querySelectorAll('.btn');
    btns.forEach(b=>b.disabled=true); btns[q.c].classList.add('correct');
    if(k===q.c){
      setTimeout(()=>{ i++; hidden=[]; locked=false; if(i>=MILLION.length) finish(PRIZES[PRIZES.length-1],true); else show(`<div class="toast good">Correct! Next question.</div>`); },900);
    } else {
      btns[k].classList.add('wrong');
      setTimeout(()=>finish(won(i),false),1100);
    }
  };
  const finish=(prize,champion)=>{
    S.million=Math.max(S.million||0,prize); save();
    app.innerHTML=''; app.append(el(header()));
    app.append(el(`<div class="card"><div class="eyebrow">${champion?'Champion!':'Game over'}</div><div class="big">${fmt(prize)} galleons</div>
      <p>${champion?'You answered all ten questions. Gringotts bank is impressed.':prize>0?'Wrong answer, but you keep your safe prize. Not bad for a Muggle.':'Wrong answer on an early question. Even Ron started somewhere.'}</p>
      <div class="row"><button class="btn primary" id="back">Back to games</button><button class="btn" id="again">Play again</button></div></div>`));
    app.querySelector('#back').onclick=()=>go('home');
    app.querySelector('#again').onclick=()=>{i=0;life={fifty:true,aud:true,phone:true};hidden=[];locked=false;show();};
  };
  show();
}

/* Game 3 */
function viewTrueFalse(){
  let i=0, score=0, locked=false;
  const show=()=>{
    app.innerHTML=''; app.append(el(header()));
    if(i>=TRUEFALSE.length){ S.truefalse=Math.max(S.truefalse||0,score); save();
      app.append(el(`<div class="card"><div class="eyebrow">True or False · result</div><div class="big">${score} / ${TRUEFALSE.length}</div><p>${score===TRUEFALSE.length?'Perfect! Were you listening, or are you secretly a wizard?':score>=5?'Good job. You were listening to the talk.':'Hmm. Time to watch the films!'}</p>
        <div class="row"><button class="btn primary" id="back">Back to games</button><button class="btn" id="again">Play again</button></div></div>`));
      app.querySelector('#back').onclick=()=>go('home'); app.querySelector('#again').onclick=()=>{i=0;score=0;show();}; return; }
    const q=TRUEFALSE[i];
    const c=el(`<div class="card"><div class="eyebrow">True or False · ${i+1} of ${TRUEFALSE.length}</div>${progress(i,TRUEFALSE.length)}<p class="qtext">${q.s}</p>
      <div class="answers two"><button class="btn" data-v="1"><span class="key">✓</span><span>True</span></button><button class="btn" data-v="0"><span class="key">✗</span><span>False</span></button></div><div id="fb"></div></div>`);
    c.querySelectorAll('.answers .btn').forEach(b=>b.onclick=()=>{ if(locked)return; locked=true; const v=b.dataset.v==='1'; const ok=v===q.t; if(ok)score++;
      b.classList.add(ok?'correct':'wrong'); c.querySelectorAll('.answers .btn').forEach(x=>x.disabled=true);
      const fb=el(`<div class="toast ${ok?'good':'bad'}"><b>${ok?'Correct.':'Nope.'}</b> ${q.why} <button class="btn primary" style="margin-top:8px;display:block" id="next">Next</button></div>`);
      c.querySelector('#fb').append(fb); fb.querySelector('#next').onclick=()=>{i++;locked=false;show();}; fb.querySelector('#next').focus(); });
    app.append(c);
    app.append(el(`<footer><a href="#" id="home">Back to games</a></footer>`)); app.querySelector('#home').onclick=(e)=>{e.preventDefault();go('home');};
  };
  show();
}

/* Game 4 */
function viewSpells(){
  let i=0, score=0, locked=false;
  const show=()=>{
    app.innerHTML=''; app.append(el(header()));
    if(i>=SPELLS.length){ S.spells=Math.max(S.spells||0,score); save();
      app.append(el(`<div class="card"><div class="eyebrow">Spell or Brand? · result</div><div class="big">${score} / ${SPELLS.length}</div><p>${score===SPELLS.length?'Outstanding! Ten points to your house.':score>=7?'Exceeds expectations. Nice work.':'Acceptable. Spells are harder than they look.'}</p>
        <div class="row"><button class="btn primary" id="back">Back to games</button><button class="btn" id="again">Play again</button></div></div>`));
      app.querySelector('#back').onclick=()=>go('home'); app.querySelector('#again').onclick=()=>{i=0;score=0;show();}; return; }
    const q=SPELLS[i];
    const c=el(`<div class="card"><div class="eyebrow">Spell or Brand? · ${i+1} of ${SPELLS.length}</div>${progress(i,SPELLS.length)}<p class="note">Is this a Harry Potter spell or a real company?</p><div class="big" style="font-size:clamp(26px,7vw,40px)">${q.w}</div>
      <div class="answers two"><button class="btn" data-v="1"><span class="key">✦</span><span>Spell</span></button><button class="btn" data-v="0"><span class="key">™</span><span>Brand</span></button></div><div id="fb"></div></div>`);
    c.querySelectorAll('.answers .btn').forEach(b=>b.onclick=()=>{ if(locked)return; locked=true; const v=b.dataset.v==='1'; const ok=v===q.spell; if(ok)score++;
      b.classList.add(ok?'correct':'wrong'); c.querySelectorAll('.answers .btn').forEach(x=>x.disabled=true);
      const fb=el(`<div class="toast ${ok?'good':'bad'}"><b>${ok?'Correct.':'Nope.'}</b> ${q.why} <button class="btn primary" style="margin-top:8px;display:block" id="next">Next</button></div>`);
      c.querySelector('#fb').append(fb); fb.querySelector('#next').onclick=()=>{i++;locked=false;show();}; fb.querySelector('#next').focus(); });
    app.append(c);
    app.append(el(`<footer><a href="#" id="home">Back to games</a></footer>`)); app.querySelector('#home').onclick=(e)=>{e.preventDefault();go('home');};
  };
  show();
}

/* Results */
function viewResults(){
  app.append(el(header()));
  const H=S.house?HOUSES[S.house]:null;
  const total=(S.truefalse||0)+(S.spells||0);
  const c=el(`<div class="card"><div class="eyebrow">Results card</div><h2>${esc(S.name)}</h2>
    ${H?`<div class="house ${S.house}" style="padding:14px 18px"><b>${H.name}</b> · house of ${H.trait}</div>`:`<p class="note">Not sorted yet. Play Game 1.</p>`}
    <div class="result-grid">
      <div><div class="k">Millionaire</div><div class="v">${S.million!=null?fmt(S.million)+' G':'–'}</div></div>
      <div><div class="k">True or False</div><div class="v">${S.truefalse!=null?S.truefalse+' / '+TRUEFALSE.length:'–'}</div></div>
      <div><div class="k">Spell or Brand</div><div class="v">${S.spells!=null?S.spells+' / '+SPELLS.length:'–'}</div></div>
      <div><div class="k">Quiz points</div><div class="v">${total} / ${TRUEFALSE.length+SPELLS.length}</div></div>
    </div>
    <p class="note">Show this screen to Polina. The highest quiz points in the group win the title of Head Student.</p>
    <button class="btn primary" id="back">Back to games</button></div>`);
  c.querySelector('#back').onclick=()=>go('home'); app.append(c);
}

window.addEventListener('hashchange', render);
render();
</script>

</body>
</html>
